apiVersion: v1
kind: ConfigMap
metadata:
  name: regelverk-mappings
data:
  soknadstype.json: |
    {
      "request": { "method": "GET", "urlPathPattern": "/api/soknadstyper/.*" },
      "response": {
        "status": 200,
        "headers": { "Content-Type": "application/json" },
        "jsonBody": { "type": "DAGPENGER", "automatiskBehandling": true }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: regelverk-api
spec:
  selector:
    app: regelverk-api
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: regelverk-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: regelverk-api
  template:
    metadata:
      labels:
        app: regelverk-api
    spec:
      containers:
        - name: wiremock
          image: wiremock/wiremock:3.9.1
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /__admin/health
              port: 8080
            periodSeconds: 5
          volumeMounts:
            - name: mappings
              mountPath: /home/wiremock/mappings
      volumes:
        - name: mappings
          configMap:
            name: regelverk-mappings